<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Tutor - интерактивный тьютор</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">🐍</span>
        <span>Python Tutor</span>
      </div>

      <div class="progress-section">
        <div class="progress-label">Прогресс</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 из 8 задач</div>
      </div>

      <div class="task-list">
        <div class="task-list-title">Задачи</div>
        <div id="taskList"></div>
      </div>

      
    </aside>

    <main class="main-content">
      <div class="task-header">
        <div class="task-info">
          <div class="task-number" id="taskNumber">Задача 1</div>
          <h1 class="task-title" id="taskTitle">Загрузка...</h1>
          <span class="task-difficulty" id="taskDifficulty">easy</span>
        </div>
      </div>

      <div class="task-description" id="taskDescription">
        Загрузка задачи...
      </div>

      <div class="editor-section">
        <div class="editor-header">
          <span>Ваш код</span>
        </div>
        <textarea
          class="code-editor"
          id="codeEditor"
          placeholder="# Введите ваш код здесь..."
          spellcheck="false"
        ></textarea>
        <div class="action-buttons">
          <button class="btn btn-primary" id="submitBtn">✓ Проверить</button>
          <button class="btn btn-secondary" id="clearBtn">Очистить</button>
        </div>
      </div>

      <div class="result-panel" id="resultPanel">
        <div class="result-header">
          <div class="result-icon" id="resultIcon"></div>
          <div class="result-title" id="resultTitle"></div>
        </div>
        <div class="result-message" id="resultMessage"></div>
        <button class="btn btn-primary" id="nextTaskBtn" style="display: none;">
          Следующая задача →
        </button>
      </div>
    </main>
  </div>

  

  <div class="toast" id="errorToast"></div>

  <script src="js/tasks.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
